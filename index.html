<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      Assets del build usan rutas relativas (vite base ./).
      <base>: dominio custom / Firebase → / ; github.io → /{repo}/ ; local → /TienditaPropia1/
    -->
    <script>
      (function () {
        var host = (location.hostname || '').toLowerCase()
        var path = location.pathname || ''
        var custom =
          host === 'citroleaf.com' ||
          host === 'www.citroleaf.com' ||
          host.endsWith('.citroleaf.com')
        var firebaseHost =
          host.endsWith('.web.app') || host.endsWith('.firebaseapp.com')
        var citroleafPath = /\/s\/citroleaf(\/|$)/.test(path)
        var base = '/'
        if (!custom && !firebaseHost) {
          if (host.endsWith('.github.io')) {
            var seg = path.split('/').filter(Boolean)[0]
            base = seg ? '/' + seg + '/' : '/'
          } else {
            base = '/TienditaPropia1/'
          }
        }
        document.write('<base href="' + base + '">')
        if (custom || citroleafPath) {
          document.title = 'Citroleaf'
          var desc = document.querySelector('meta[name="description"]')
          if (desc) {
            desc.setAttribute(
              'content',
              'Protección natural para tu piel y para tu planeta. Repelentes orgánicos contra zancudos, hechos en Lima.'
            )
          }
          var og = document.querySelector('meta[property="og:title"]')
          if (og) og.setAttribute('content', 'Citroleaf')
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tiendas virtuales en Lima, Perú. La Tiendita Chévere, Citroleaf y Piyukis." />
    <meta name="theme-color" content="#261F1A" />
    <meta property="og:title" content="TienditaPropia — Multi-tienda" />
    <meta property="og:description" content="Tiendas virtuales en Lima Metropolitana" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PE" />
    <title>TienditaPropia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://js.culqi.com/checkout-js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
